[package]
name = "tallycast"
version = "0.1.0"
description = "Tallycast – a fast, modern screen recorder"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tallycast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
